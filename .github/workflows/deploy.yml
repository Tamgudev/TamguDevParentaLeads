name: Generate & Encrypt Leads

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight
  workflow_dispatch:      # Allows manual trigger anytime

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Lead Scraper
        run: |
          pip install pandas requests
          python fetch_leads.py

      - name: Password Protect HTML with StatiCrypt
        run: |
          npm install -g staticrypt
          staticrypt index.html -p "${{ secrets.SITE_PASSWORD }}" -d dist

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
